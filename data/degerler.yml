# Değişken değerler için tek kaynak.
# Sayfalar bu dosyayı <Deger k="grup.anahtar" /> bileşeniyle okur; bilinmeyen anahtar build'i kırar.
# Her değer şu alanlarla girilir:
#   etiket: insan okur için kısa ad (referans/kaynaklar.md tablosunda görünür)
#   deger: tam açıklama metni
#   kisa: (opsiyonel) sayfada satır içi gösterilen kısa biçim; yoksa deger kullanılır
#   sayi: (opsiyonel) hesaplayıcılar için sayısal değer
#   kaynak: birincil (veya en iyi bulunan) kaynak URL'si; birden fazlaysa ";" ile ayrılır
#   dogrulama_tarihi: kaynağın kontrol edildiği tarih (GG.AA.YYYY); 120 günden eskiyse tazelik workflow'u issue açar
#   durum: "dogrulandi" | "belirsiz" (çelişkili/ikincil kaynak; okura "teyit et" rozeti gösterilir)
#   not: (opsiyonel) kısa açıklama/istisna
#
# Ham araştırma raporları: docs-internal/arastirma-notlari/*.md
# Detaylı kaynak listesi: SOURCES.md

