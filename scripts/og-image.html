<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;background:#141a33;color:#fff;position:relative;overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(900px 500px at 85% 10%,#3b4d9a 0%,rgba(20,26,51,0) 60%),radial-gradient(700px 400px at 0% 100%,#22306b 0%,rgba(20,26,51,0) 65%)}
.wrap{position:absolute;inset:0;padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between}
.marka{font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:#a9b6f5;font-weight:600}
h1{font-size:96px;line-height:1.02;font-weight:800;letter-spacing:-.02em;max-width:900px}
p{font-size:40px;line-height:1.3;color:#d5dbff;margin-top:24px;max-width:860px}
.etiketler{display:flex;gap:16px}
.etiket{padding:10px 22px;border:2px solid #5b6fc7;border-radius:999px;font-size:26px;color:#dfe4ff}
.cizgi{position:absolute;left:0;top:0;width:14px;height:100%;background:#7a8df0}
</style></head><body><div class="bg"></div><div class="cizgi"></div>
<div class="wrap"><div class="marka">Türkçe · Kaynaklı · Adım adım</div>
<div><h1>Almanya Master Rehberi</h1><p>Sıfırdan yerleşene kadar, tek rota.</p></div>
<div class="etiketler"><span class="etiket">7 faz</span><span class="etiket">32 adım</span><span class="etiket">Her sayfada kaynak ve tarih</span></div></div>
</body></html>
