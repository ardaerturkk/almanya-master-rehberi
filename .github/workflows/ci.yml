name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - name: Kırık iç link kontrolü
        run: |
          npm run docs:preview -- --port 4173 &
          npx wait-on http://localhost:4173/almanya-master-rehberi/
          # Dış linkler (gesetze-im-internet, üniversite siteleri vb.) GitHub runner'larından
          # sık sık bağlantı reddi veriyor; dış link kontrolü haftalık tazelik workflow'unda.
          npx linkinator http://localhost:4173/almanya-master-rehberi/ --recurse --silent \
            --concurrency 5 --skip "^https?://(?!localhost)"
      - name: Markdown lint
        run: npx markdownlint-cli2 "docs/**/*.md" "!docs/.vitepress/**"
